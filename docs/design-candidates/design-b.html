<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what lets env(safe-area-inset-*) report real numbers
     on a notched iPhone; without it the insets are all 0 and the app tucks
     itself under the Dynamic Island. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Namaz — El-Feth</title>
<meta name="description" content="Orarul rugăciunilor — Moscheea El-Feth, Tilburg.">

<!-- The service worker looks for this string to tell our page apart from a
     captive-portal login page before it caches anything. See sw.js. -->
<meta name="app-id" content="elfeth-prayer-times">

<!-- iOS home-screen behaviour. "default" (not black-translucent) because the
     app has both a light and a dark skin: default lets iOS pick the status-bar
     text colour from the system appearance, so it stays legible either way. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Namaz">
<!-- Stops iOS turning "16:50" and similar into tappable phone links. -->
<meta name="format-detection" content="telephone=no">

<!-- Plain value first for anything that ignores the media attribute
     (Safari < 15.4), then the two real ones. -->
<meta name="theme-color" content="#F2E9DB">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2E9DB">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14110E">

<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS ignores the manifest icons for the home screen; this is the one it uses. -->
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">

<style>
/* ===========================================================================
   "Warm dusk" — sand, clay, deep teal-green, faded gold.
   Two skins, chosen by the system: warm paper by day, dusk by night. The dark
   one is the one that matters: he looks at this at 04:00 in an unlit room, so
   nothing is pure white, nothing is pure black, and the brightest thing on
   screen is a parchment-coloured number, not a field of light.
   =========================================================================== */

:root{
  color-scheme: light dark;

  /* — warm paper (daylight) — */
  --bg:#F2E9DB;
  --sky:
    radial-gradient(130% 70% at 50% -12%, rgba(45,106,94,.10), rgba(45,106,94,0) 62%),
    radial-gradient(160% 55% at 50% 14%, rgba(168,95,65,.11), rgba(168,95,65,0) 72%),
    linear-gradient(180deg, #F7F1E6 0%, #F2E9DB 46%, #EADFCC 100%);
  --card:rgba(255,252,246,.72);
  --card-2:rgba(255,252,246,.42);
  --line:rgba(58,46,36,.12);
  --line-soft:rgba(58,46,36,.07);
  --ink:#2C251E;
  --ink-2:#6B5C4D;
  --ink-3:#9B8A76;
  --gold:#A5842F;
  --shadow:0 10px 30px -22px rgba(60,40,25,.55);
  --inset:inset 0 1px 0 rgba(255,255,255,.65);

  /* day-ribbon segment colours */
  --c-fajr:#6E9E99;
  --c-gap:rgba(58,46,36,.07);
  --c-dhuhr:#C2A464;
  --c-asr:#C08A5A;
  --c-maghrib:#B5674A;
  --c-isha:#5A7C85;
  --c-tahajjud:#B79338;
}

/* Per-prayer accent. One hue set for both skins (these are all low-saturation
   mid-tones that survive on paper and on near-black); only the *text* tint is
   re-lit for the dark skin further down. */
#app[data-next="fajr"]   { --accent:#4E8B86; --accent-ink:#2F6F68; }
#app[data-next="dhuhr"]  { --accent:#B08A3E; --accent-ink:#8A6A26; }
#app[data-next="asr"]    { --accent:#B0703F; --accent-ink:#8C5629; }
#app[data-next="maghrib"]{ --accent:#B25538; --accent-ink:#8F4024; }
#app[data-next="isha"]   { --accent:#4A6B77; --accent-ink:#35545F; }
#app[data-next="none"]   { --accent:#7E7568; --accent-ink:#5F584E; }

@media (prefers-color-scheme: dark){
  :root{
    /* — dusk: the sky twenty minutes after Maghrib — teal above, ember at the
         horizon, warm near-black below. */
    --bg:#14110E;
    --sky:
      radial-gradient(120% 60% at 50% -8%, rgba(88,160,145,.13), rgba(88,160,145,0) 60%),
      radial-gradient(150% 52% at 50% 20%, rgba(190,112,78,.15), rgba(190,112,78,0) 70%),
      linear-gradient(180deg, #191511 0%, #15120F 44%, #100E0C 100%);
    --card:rgba(244,232,214,.045);
    --card-2:rgba(244,232,214,.025);
    --line:rgba(240,230,214,.10);
    --line-soft:rgba(240,230,214,.055);
    --ink:#F0E5D3;
    --ink-2:#BCAC96;
    --ink-3:#8A7C6B;
    --gold:#CDAC66;
    --shadow:0 14px 34px -26px rgba(0,0,0,.9);
    --inset:inset 0 1px 0 rgba(255,246,232,.055);

    --c-fajr:#3F6F70;
    --c-gap:rgba(240,230,214,.06);
    --c-dhuhr:#8A7443;
    --c-asr:#96613A;
    --c-maghrib:#9E4E33;
    --c-isha:#2F4952;
    --c-tahajjud:#A98436;
  }
  #app[data-next="fajr"]   { --accent-ink:#79BCB4; }
  #app[data-next="dhuhr"]  { --accent-ink:#D3B067; }
  #app[data-next="asr"]    { --accent-ink:#D19461; }
  #app[data-next="maghrib"]{ --accent-ink:#D4795A; }
  #app[data-next="isha"]   { --accent-ink:#7FA4B1; }
  #app[data-next="none"]   { --accent-ink:#A79B8B; }
}

*,*::before,*::after{ box-sizing:border-box; }

html{
  background:var(--bg);              /* what the rubber-band overscroll reveals */
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overscroll-behavior:none;
}

body{
  margin:0;
  min-height:100vh;                  /* old iOS */
  min-height:100dvh;                 /* iOS 16+: survives the shrinking toolbar */
  background:transparent;            /* the gradient lives on the fixed layer below */
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:rgba(0,0,0,0);
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;         /* no double-tap zoom on a display-only app */
}

/* Fixed so the gradient does not slide with the (rare) scroll and does not
   repaint on every iOS toolbar resize. */
.sky{
  position:fixed; top:0; right:0; bottom:0; left:0;
  z-index:-1; background:var(--sky); pointer-events:none;
}

/* Every number on screen is tabular so the countdown does not twitch. */
.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

.app{
  max-width:560px;
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top, 0px) + 18px)
    calc(env(safe-area-inset-right, 0px) + 18px)
    calc(env(safe-area-inset-bottom, 0px) + 20px)
    calc(env(safe-area-inset-left, 0px) + 18px);
}

/* ---------- header ---------- */
.head{ padding:2px 4px 11px; }
.date{
  font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;
  font-size:19px; font-weight:400; letter-spacing:.005em; color:var(--ink);
}
.place{
  margin-top:3px; font-size:10.5px; letter-spacing:.17em; text-transform:uppercase;
  color:var(--ink-3);
}
.place .sep{ opacity:.55; padding:0 .25em; }

/* ---------- cards ---------- */
.card{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow), var(--inset);
  -webkit-backdrop-filter:saturate(140%) blur(8px);
  backdrop-filter:saturate(140%) blur(8px);
}

/* ---------- hero: the thing he actually looks at ---------- */
.hero{ overflow:hidden; padding:15px 20px 14px; text-align:center; }
.hero .glow{
  position:absolute; left:50%; top:-64%;
  width:150%; height:150%; transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%, var(--accent), rgba(0,0,0,0) 70%);
  opacity:.17; pointer-events:none;
  transition:background 1.2s ease, opacity 1.2s ease;
}
@media (prefers-color-scheme: dark){ .hero .glow{ opacity:.22; } }

.kicker{
  margin:0; font-size:10.5px; letter-spacing:.19em; text-transform:uppercase;
  color:var(--ink-3);
}
.count{
  margin:5px 0 2px;
  font-size:clamp(46px, 15.5vw, 68px);
  line-height:1.02;
  font-weight:300;
  letter-spacing:-.035em;
  color:var(--ink);
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
.heroFoot{
  display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap;
  gap:0 9px; margin-top:4px;
}
.pname{
  font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;
  font-size:23px; color:var(--accent-ink); letter-spacing:.005em;
}
.ptr{ font-size:13.5px; color:var(--ink-3); }
.pat{
  font-size:13.5px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
.pat::before{
  content:""; display:inline-block; width:3px; height:3px; border-radius:50%;
  background:var(--accent); vertical-align:.32em; margin-right:7px; opacity:.8;
}

/* ---------- the day ribbon ---------- */
.arcWrap{ margin:13px 4px 2px; }
.arc{
  position:relative; height:11px; border-radius:6px; overflow:hidden;
  background:var(--c-gap); border:1px solid var(--line-soft);
}
.seg{ position:absolute; top:0; bottom:0; }
.seg.s-fajr{ background:var(--c-fajr); }
.seg.s-dhuhr{ background:var(--c-dhuhr); }
.seg.s-asr{ background:var(--c-asr); }
.seg.s-maghrib{ background:var(--c-maghrib); }
.seg.s-isha{ background:var(--c-isha); }
.seg.s-gap{ background:transparent; }
.segs{ position:absolute; top:0; right:0; bottom:0; left:0; opacity:.78; }
/* Tahajjud rides on top of Isha rather than beside it — that overlap is the
   point, so it is drawn as a hairline over the ribbon, not as its own slot. */
.tah{ position:absolute; top:0; height:3px; background:var(--c-tahajjud); opacity:.95; }
.nowMark{
  position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px;
  background:var(--ink); border-radius:2px; box-shadow:0 0 0 2px var(--bg);
}
.arcLabels{ position:relative; height:14px; margin-top:5px; }
.arcLabels span{
  position:absolute; top:0; transform:translateX(-50%); white-space:nowrap;
  font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}

/* ---------- open-window card ---------- */
.now{ margin-top:11px; padding:13px 18px 14px; }
.nowHead{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.nowName{
  font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;
  font-size:19px; color:var(--ink);
}
.nowName em{ font-style:normal; font-size:13px; color:var(--ink-3); margin-left:7px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; }
.nowMid{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  margin-top:7px; font-size:14px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
.nowMid .to{ color:var(--ink-3); padding:0 .35em; }
.nowLeft{ color:var(--ink-3); font-size:12.5px; white-space:nowrap; }
.prog{
  position:relative; height:3px; margin-top:11px; border-radius:2px;
  background:var(--line-soft); overflow:hidden;
}
.prog i{
  position:absolute; left:0; top:0; bottom:0; display:block; width:0;
  background:var(--accent); opacity:.85; border-radius:2px;
}
.now.is-gap .prog i{ background:var(--ink-3); opacity:.45; }
.now.is-gap .nowName{ font-size:17px; }

/* ---------- timeline ---------- */
.tl{ margin-top:11px; padding:5px 16px 6px; }

.night{ list-style:none; margin:0; padding:0; }
.rows{ list-style:none; margin:0; padding:0; position:relative; }
/* the hairline the dots sit on */
.rows::before{
  content:""; position:absolute; left:4px; top:22px; bottom:22px;
  width:1px; background:var(--line-soft);
}

.row{
  position:relative; display:flex; align-items:center; gap:12px;
  padding:7px 0 7px 20px; min-height:40px;
}
.row + .row{ border-top:1px solid var(--line-soft); }
.dot{
  position:absolute; left:0; top:50%; width:9px; height:9px; margin-top:-4.5px;
  border-radius:50%; border:1px solid var(--ink-3); background:var(--bg);
  box-shadow:0 0 0 3px var(--bg);
}
.names{ flex:1 1 auto; min-width:0; }
.nm{
  display:block;
  font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;
  font-size:17px; color:var(--ink); letter-spacing:.005em;
}
.tr{ display:block; font-size:11.5px; color:var(--ink-3); margin-top:1px; }
.range{
  flex:0 0 auto; text-align:right; font-size:14px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
.range .to{ color:var(--ink-3); padding:0 .3em; }
.tag{
  flex:0 0 auto; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); border:1px solid var(--line); border-radius:999px;
  padding:3px 7px 2px; white-space:nowrap;
}

.row.is-past{ opacity:.46; }
.row.is-next .dot{ border-color:var(--accent); }
.row.is-next .tag{ color:var(--accent-ink); border-color:var(--accent); }
.row.is-open .dot{ background:var(--accent); border-color:var(--accent);
  box-shadow:0 0 0 3px var(--bg), 0 0 10px 0 var(--accent); }
.row.is-open .nm{ color:var(--ink); }
.row.is-open .tag{ color:var(--accent-ink); border-color:var(--accent); }
.row.is-open .range{ color:var(--ink); }
/* the open row carries its own progress: a 2px rule that fills left to right */
.rowbar{
  position:absolute; left:20px; right:0; bottom:0; height:2px; border-radius:2px;
  background:var(--line-soft); overflow:hidden;
}
.rowbar i{
  position:absolute; left:0; top:0; bottom:0; width:0; display:block;
  background:var(--accent); opacity:.65; border-radius:2px;
}

/* the sunrise hairline — a boundary, never a prayer row */
.mark{
  position:relative; display:flex; align-items:center; gap:9px;
  padding:5px 0 5px 20px; font-size:11px; color:var(--ink-3);
  border-top:1px solid var(--line-soft);
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
.mark::before{
  content:""; position:absolute; left:1.5px; top:50%; width:6px; height:1px;
  background:var(--ink-3); opacity:.5;
}
.mark .mt{ letter-spacing:.02em; }

/* Tahajjud: voluntary, and it overlaps Isha — so it is drawn as its own band
   above the five, in gold, with a dashed edge instead of a dot. */
.night .row{
  padding-left:20px; border:0; border-left:0;
  margin:1px 0 4px; padding-top:8px; padding-bottom:8px;
  background:
    linear-gradient(90deg, rgba(183,147,56,.10), rgba(183,147,56,0) 60%);
  border-radius:12px;
}
.night .row::before{
  content:""; position:absolute; left:6px; top:12px; bottom:12px; width:0;
  border-left:1px dashed var(--c-tahajjud); opacity:.7;
}
.night .dot{ display:none; }          /* the dashed edge is its marker instead */
.night .nm{ color:var(--gold); }
.night .tag{ color:var(--gold); border-color:rgba(183,147,56,.45); }
.night .row.is-open{ background:linear-gradient(90deg, rgba(183,147,56,.20), rgba(183,147,56,0) 70%); }
/* Tahajjud keeps its gold even when it is the open window: it must never be
   mistaken for one of the five. */
.night .row.is-open .tag{ color:var(--gold); border-color:var(--gold); }
.night .row.is-open .rowbar i{ background:var(--c-tahajjud); }
.note{
  display:block; font-size:10.5px; color:var(--ink-3); margin:0 0 6px 20px;
  letter-spacing:.01em; line-height:1.3;
}
.nightSep{ height:1px; background:var(--line-soft); margin:0 0 2px; }

/* ---------- footer ---------- */
.foot{
  margin:13px 6px 0; text-align:center;
  font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  opacity:.75;
}

/* Transitions are a nicety; anyone who asked the phone to stop moving gets a
   still picture. */
@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
}

/* Short phones: give the countdown a little less air rather than pushing the
   timeline off the bottom. The page can still scroll if it has to. */
@media (max-height: 740px){
  .head{ padding-bottom:8px; }
  .date{ font-size:17px; }
  .hero{ padding:11px 20px 11px; }
  .count{ font-size:clamp(40px, 13.5vw, 52px); }
  .arcWrap{ margin:10px 4px 2px; }
  .now{ margin-top:9px; padding:11px 18px 12px; }
  .tl{ margin-top:9px; }
  .row{ min-height:36px; padding-top:5px; padding-bottom:5px; }
  .nm{ font-size:16px; }
  .note{ font-size:10px; margin-bottom:4px; }
  .foot{ margin-top:10px; }
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<div class="app" id="app" data-next="none">

  <header class="head">
    <h1 class="date num" id="date">&nbsp;</h1>
    <div class="place">Tilburg<span class="sep">·</span>Moscheea El-Feth</div>
  </header>

  <section class="card hero">
    <div class="glow" aria-hidden="true"></div>
    <p class="kicker">Următorul adhan</p>
    <p class="count" id="count" role="timer" aria-live="off">--:--:--</p>
    <div class="heroFoot">
      <span class="pname" id="nextName">—</span>
      <span class="ptr" id="nextTr"></span>
      <span class="pat" id="nextAt">--:--</span>
    </div>
  </section>

  <div class="arcWrap">
    <div class="arc" id="arc" aria-hidden="true">
      <div class="segs" id="segs"></div>
      <div class="tah" id="tahBar" style="left:0;width:0"></div>
      <div class="nowMark" id="nowMark" style="left:0"></div>
    </div>
    <div class="arcLabels" id="arcLabels" aria-hidden="true"></div>
  </div>

  <section class="card now" id="nowCard">
    <div class="nowHead">
      <span class="kicker" id="nowKicker">Acum</span>
      <span class="nowName" id="nowName">—</span>
    </div>
    <div class="nowMid">
      <span class="num" id="nowRange">--:--</span>
      <span class="nowLeft" id="nowLeft"></span>
    </div>
    <div class="prog"><i id="nowProg"></i></div>
  </section>

  <section class="card tl">
    <ul class="night" id="nightList"></ul>
    <p class="note" id="nightNote"></p>
    <div class="nightSep"></div>
    <ul class="rows" id="rowList"></ul>
  </section>

  <footer class="foot" id="foot">Orar oficial al moscheii</footer>
</div>

<script>
(function () {
'use strict';

/* =========================================================================
   TIME MATHS — pure functions, no DOM. Copied verbatim by the test harness in
   the scratch folder, so keep this block self-contained and keep the markers.
   ------------------------------------------------------------------- BEGIN */

var TZ = 'Europe/Amsterdam';

// One formatter, built once: constructing an Intl.DateTimeFormat is expensive
// and this runs every second.
var PARTS = new Intl.DateTimeFormat('en-US', {
  timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
});

// The phone's own clock zone is never consulted: he travels, and the mosque's
// timetable does not travel with him. Everything goes through Amsterdam.
function zonedParts(ms) {
  var p = PARTS.formatToParts(new Date(ms)), o = {}, i;
  for (i = 0; i < p.length; i++) { if (p[i].type !== 'literal') o[p[i].type] = p[i].value; }
  var h = parseInt(o.hour, 10);
  if (h === 24) h = 0;                       // older WebKit reports midnight as 24
  return { y: +o.year, m: +o.month, d: +o.day, h: h, mi: +o.minute, s: +o.second };
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function keyOf(m, d) { return pad2(m) + '-' + pad2(d); }

// times.json holds one entry per calendar day of a non-leap source year, so
// 29 February is simply absent; 28 February is within a minute of it.
function entryFor(days, m, d) {
  var e = days[keyOf(m, d)];
  if (!e && m === 2 && d === 29) e = days['02-28'];
  return e || null;
}

function utcMidnight(y, m, d) { return Date.UTC(y, m - 1, d); }

function shiftDay(y, m, d, delta) {
  var t = new Date(utcMidnight(y, m, d) + delta * 86400000);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() };
}

// The stored numbers are minutes after 00:00 *UTC* on that calendar day, i.e.
// they encode an instant, not a clock reading. Add them to UTC midnight and let
// Intl re-render them through whatever daylight-saving rule is in force this
// year — which is the whole reason the file is built this way.
function dayTimes(days, y, m, d) {
  var e = entryFor(days, m, d);
  if (!e) return null;
  var base = utcMidnight(y, m, d);
  return {
    y: y, m: m, d: d, src: e.src,
    fajr: base + e.fajr * 60000,
    sunrise: base + e.sunrise * 60000,
    dhuhr: base + e.dhuhr * 60000,
    asr: base + e.asr * 60000,
    maghrib: base + e.maghrib * 60000,
    isha: base + e.isha * 60000
  };
}

// Only ever used if a neighbouring day is missing from the file, which should
// not happen; sliding today by 24h keeps the ordering sane instead of producing
// negative windows.
function slideTimes(t, deltaDays) {
  var o = { y: t.y, m: t.m, d: t.d, src: t.src }, k;
  var ks = ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha'];

// The night that ends at this Fajr began at the previous Maghrib; its last
// third is Tahajjud. Rounded to the minute because everything else on screen is
// whole minutes and a computed value with seconds would look like a bug.
function tahajjudStart(fajrMs, prevMaghribMs) {
  return Math.round((fajrMs - (fajrMs - prevMaghribMs) / 3) / 60000) * 60000;

function buildModel(data, now) {
  var np = zonedParts(now);
  var model = {
    now: now, date: np, ready: false,
    dayKey: keyOf(np.m, np.d)
  };
  if (!data || !data.days) return model;

  var today = dayTimes(data.days, np.y, np.m, np.d);
  if (!today) return model;

  var yp = shiftDay(np.y, np.m, np.d, -1);
  var tp = shiftDay(np.y, np.m, np.d, 1);
  var prev = dayTimes(data.days, yp.y, yp.m, yp.d) || slideTimes(today, -1);
  var next = dayTimes(data.days, tp.y, tp.m, tp.d) || slideTimes(today, 1);

  // The five obligatory windows of this calendar day. Isha runs past midnight
  // into tomorrow's Fajr; Fajr ends at sunrise, not at Dhuhr.
  var win = {
    fajr:    { id: 'fajr',    start: today.fajr,    end: today.sunrise },
    dhuhr:   { id: 'dhuhr',   start: today.dhuhr,   end: today.asr },
    asr:     { id: 'asr',     start: today.asr,     end: today.maghrib },
    maghrib: { id: 'maghrib', start: today.maghrib, end: today.isha },
    isha:    { id: 'isha',    start: today.isha,    end: next.fajr }
  };

  // What is open right now. Before today's Fajr we are still inside *last
  // night's* Isha — the row shows that occurrence, not tonight's, because
  // pretending otherwise would put a future start time on an open window.
  var open;
  if (now < today.fajr)          open = { id: 'isha', start: prev.isha,     end: today.fajr, carried: true };
  else if (now < today.sunrise)  open = { id: 'fajr', start: today.fajr,    end: today.sunrise };
  else if (now < today.dhuhr)    open = { id: null,   start: today.sunrise, end: today.dhuhr, gap: true };
  else if (now < today.asr)      open = { id: 'dhuhr',   start: today.dhuhr,   end: today.asr };
  else if (now < today.maghrib)  open = { id: 'asr',     start: today.asr,     end: today.maghrib };
  else if (now < today.isha)     open = { id: 'maghrib', start: today.maghrib, end: today.isha };
  else                           open = { id: 'isha',    start: today.isha,    end: next.fajr };

  // Next adhan: the next of the five to be *called*. Tahajjud has no adhan and
  // sunrise is not a prayer, so neither appears here. Strictly greater than
  // now, so standing exactly on Dhuhr shows the countdown to Asr, not 00:00:00.
  var seq = [
    { id: 'fajr', at: today.fajr },
    { id: 'dhuhr', at: today.dhuhr },
    { id: 'asr', at: today.asr },
    { id: 'maghrib', at: today.maghrib },
    { id: 'isha', at: today.isha },
    { id: 'fajr', at: next.fajr, tomorrow: true }
  ];
  var nextAdhan = null, i;
  for (i = 0; i < seq.length; i++) { if (seq[i].at > now) { nextAdhan = seq[i]; break; } }
  if (!nextAdhan) nextAdhan = { id: 'fajr', at: next.fajr, tomorrow: true };

  // Tahajjud is shown as the nearest one that still matters: this morning's
  // while the night is still running, tonight's once Fajr has passed.
  var tah;
  if (now < today.fajr) {
    tah = { start: tahajjudStart(today.fajr, prev.maghrib), end: today.fajr, tonight: false };
  } else {
    tah = { start: tahajjudStart(next.fajr, today.maghrib), end: next.fajr, tonight: true };
  }
  tah.active = (now >= tah.start && now < tah.end);
  tah.past = (now >= tah.end);

  // The ribbon spans the prayer-day we are actually inside: Fajr to Fajr. In
  // the small hours that is yesterday's, which is where the "now" mark belongs.
  var arcBase = (now < today.fajr) ? prev : today;
  var arcEnd  = (now < today.fajr) ? today.fajr : next.fajr;

  model.ready = true;
  model.today = today; model.prev = prev; model.next = next;
  model.win = win;
  model.open = open;
  model.nextAdhan = nextAdhan;
  model.remaining = nextAdhan.at - now;
  model.tahajjud = tah;

  model.src = today.src;

  var i = 0;
  var tryNext = function () {
    if (i >= TIMES_URLS.length) { loading = false; return; }
    var url = TIMES_URLS[i++];
    fetchOnce(url, 8000).then(function (txt) {
      var j = null;
      try { j = JSON.parse(txt); } catch (e) { j = null; }
      // A captive portal answers every request with HTML; JSON.parse fails and
      // we simply keep whatever we already had on screen.
      if (j && j.days && typeof j.days === 'object' && looksLikeTimetable(j.days)) {
        data = j;
        writeStore(txt);
        loading = false;
        render(true);
      } else {
        tryNext();
      }
    })['catch'](function () { tryNext(); });
  };
  tryNext();
}

/* ------------------------------------------------------------- rendering - */

function $(id) { return document.getElementById(id); }

// Touching textContent on an unchanged node still costs a style recalc on iOS,
// and this runs every second.
function setText(el, s) { if (el && el.__t !== s) { el.__t = s; el.textContent = s; } }
function setStyle(el, prop, v) {
  if (!el) return;
  var k = '__s_' + prop;
  if (el[k] !== v) { el[k] = v; el.style[prop] = v; }
}
function pct(x) { return (Math.round(x * 10000) / 100) + '%'; }

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}

function rangeSpan(a, b) {
  var s = el('span', 'range num');
  s.appendChild(document.createTextNode(fmtClock(a)));
  s.appendChild(el('span', 'to', '→'));
  s.appendChild(document.createTextNode(fmtClock(b)));
  return s;
}

function addBar(row) {
  var wrap = el('span', 'rowbar');
  var fill = el('i');
  wrap.appendChild(fill);
  row.appendChild(wrap);
  return fill;
}

var listSig = '';
var barEls = {};

function buildLists(m) {
  var night = $('nightList'), list = $('rowList');
  night.textContent = '';
  list.textContent = '';
  barEls = {};

  // --- Tahajjud, in its own band above the five ---
  var t = m.tahajjud;
  var trow = el('li', 'row' + (t.active ? ' is-open' : (t.past ? ' is-past' : '')));
  var tn = el('span', 'names');
  tn.appendChild(el('span', 'nm', NAMES.tahajjud[0]));
  tn.appendChild(el('span', 'tr', NAMES.tahajjud[1]));
  trow.appendChild(tn);
  trow.appendChild(rangeSpan(t.start, t.end));
  trow.appendChild(el('span', 'tag', t.active ? 'acum' : (t.tonight ? 'la noapte' : 'dimineață')));
  if (t.active) barEls.tah = addBar(trow);
  night.appendChild(trow);
  setText($('nightNote'),
    'Voluntar · ultima treime a nopții, înăuntrul ferestrei Isha');

  // --- the five obligatory windows, in order, with sunrise as a hairline ---
  var i, id, w, row, names, cls;
  for (i = 0; i < ORDER.length; i++) {
    id = ORDER[i];
    w = m.win[id];
    // The open Isha of the small hours started last night; show that occurrence.
    if (id === m.open.id && m.open.carried) w = { id: id, start: m.open.start, end: m.open.end };

    cls = 'row';
    // "urmează" is deliberately not put on a row when the next adhan is
    // tomorrow's Fajr: that row is showing *today's* Fajr, which is long past.
    // The hero already says "la 06:03 (mâine)".
    if (m.open.id === id) cls += ' is-open';
    else if (m.nextAdhan.id === id && !m.nextAdhan.tomorrow) cls += ' is-next';
    else if (w.end <= m.now) cls += ' is-past';

    row = el('li', cls);
    row.appendChild(el('span', 'dot'));
    names = el('span', 'names');
    names.appendChild(el('span', 'nm', NAMES[id][0]));
    names.appendChild(el('span', 'tr', NAMES[id][1]));
    row.appendChild(names);
    row.appendChild(rangeSpan(w.start, w.end));

    if (m.open.id === id) row.appendChild(el('span', 'tag', m.open.carried ? 'de aseară' : 'acum'));
    else if (m.nextAdhan.id === id && !m.nextAdhan.tomorrow) row.appendChild(el('span', 'tag', 'urmează'));

    list.appendChild(row);
    if (m.open.id === id) barEls.row = addBar(row);

    // Sunrise closes Fajr and nothing opens until Dhuhr — said plainly, once.
    if (id === 'fajr') {
      var mk = el('li', 'mark');
      mk.appendChild(el('span', 'mt',
        'Răsărit ' + fmtClock(m.today.sunrise) + ' — nicio fereastră până la Dhuhr'));
      list.appendChild(mk);
    }
  }
}

var arcSig = '';

function buildArc(m) {
  var segs = $('segs'), labels = $('arcLabels');
  segs.textContent = '';
  labels.textContent = '';
  var b = m.arc.base, span = m.arc.end - m.arc.start;
  if (span <= 0) return;
  var at = function (ms) { return (ms - m.arc.start) / span; };

  var parts = [
    ['fajr', b.fajr, b.sunrise],
    ['gap', b.sunrise, b.dhuhr],
    ['dhuhr', b.dhuhr, b.asr],
    ['asr', b.asr, b.maghrib],
    ['maghrib', b.maghrib, b.isha],
    ['isha', b.isha, m.arc.end]
  ];
  for (var i = 0; i < parts.length; i++) {
    var s = el('span', 'seg s-' + parts[i][0]);
    s.style.left = pct(at(parts[i][1]));
    s.style.width = pct(at(parts[i][2]) - at(parts[i][1]));
    segs.appendChild(s);
  }

  var t = m.tahajjud, bar = $('tahBar');
  var l = at(t.start), r = at(t.end);
  if (r > 0 && l < 1) {
    bar.style.left = pct(Math.max(0, l));
    bar.style.width = pct(Math.min(1, r) - Math.max(0, l));
    bar.style.display = '';
  } else {
    bar.style.display = 'none';
  }

  var a = el('span', null, 'Răsărit');
  a.style.left = pct(Math.min(0.82, Math.max(0.12, at(b.sunrise))));
  labels.appendChild(a);
  var c = el('span', null, 'Apus');
  c.style.left = pct(Math.min(0.88, Math.max(0.2, at(b.maghrib))));
  labels.appendChild(c);
}

function render(force) {
  var m = buildModel(data, Date.now());

  setText($('date'), roDate(m.date));

  if (!m.ready) {
    // Should be unreachable — the seed covers every day of the year — but a
    // half-drawn screen beats a blank one if the table is ever malformed.
    setText($('count'), '--:--:--');
    setText($('nextName'), '—');
    setText($('nowName'), '—');
    return;
  }

  var app = $('app');
  var accentId = m.nextAdhan.id || 'none';
  if (app.getAttribute('data-next') !== accentId) app.setAttribute('data-next', accentId);

  // hero
  setText($('count'), fmtCountdown(m.remaining));
  setText($('nextName'), NAMES[m.nextAdhan.id][0]);
  setText($('nextTr'), NAMES[m.nextAdhan.id][1]);
  setText($('nextAt'), 'la ' + fmtClock(m.nextAdhan.at) + (m.nextAdhan.tomorrow ? ' (mâine)' : ''));

  // open window
  var card = $('nowCard');
  var isGap = !!m.open.gap;
  if (card.__gap !== isGap) {
    card.__gap = isGap;
    card.className = 'card now' + (isGap ? ' is-gap' : '');
  }
  if (isGap) {
    // Said plainly. The interval underneath is sunrise -> Dhuhr, so the card
    // still shows how much of the empty stretch is left.
    setText($('nowKicker'), 'Acum');
    setText($('nowName'), 'Nicio fereastră deschisă');
    setText($('nowLeft'), 'Dhuhr peste ' + fmtLeft(m.open.end - m.now));
  } else {
    setText($('nowKicker'), m.open.carried ? 'Deschis · de aseară' : 'Fereastra deschisă');
    setText($('nowName'), NAMES[m.open.id][0]);
    setText($('nowLeft'), 'se închide peste ' + fmtLeft(m.open.end - m.now));
  }
  //   = thin space: HTML would collapse ordinary doubled spaces.
  setText($('nowRange'), fmtClock(m.open.start) + '  →  ' + fmtClock(m.open.end));

  var frac = (m.now - m.open.start) / (m.open.end - m.open.start);
  if (!(frac >= 0)) frac = 0;
  if (frac > 1) frac = 1;
  setStyle($('nowProg'), 'width', pct(frac));

  // lists — rebuilt only when the day or the highlighted rows actually change
  var sig = m.dayKey + '|' + m.open.id + '|' + m.open.start + '|' +
            m.nextAdhan.id + '|' + m.nextAdhan.at + '|' + m.tahajjud.start +
            '|' + (m.tahajjud.active ? 1 : 0) + '|' + (data && data.seeded ? 's' : 'f');
  if (force || sig !== listSig) { listSig = sig; buildLists(m); }

  var asig = m.arc.start + '|' + m.arc.end + '|' + m.tahajjud.start;
  if (force || asig !== arcSig) { arcSig = asig; buildArc(m); }

  // the two things that move continuously
  var arcFrac = (m.now - m.arc.start) / (m.arc.end - m.arc.start);
  if (!(arcFrac >= 0)) arcFrac = 0;
  if (arcFrac > 1) arcFrac = 1;
  setStyle($('nowMark'), 'left', pct(arcFrac));
  if (barEls.row) setStyle(barEls.row, 'width', pct(frac));
  if (barEls.tah) {
    var tf = (m.now - m.tahajjud.start) / (m.tahajjud.end - m.tahajjud.start);
    if (!(tf >= 0)) tf = 0;
    if (tf > 1) tf = 1;
    setStyle(barEls.tah, 'width', pct(tf));
  }
}

/* ------------------------------------------------------------- lifecycle - */

var tickTimer = null;

// Aligned to the wall clock rather than a fixed interval: iOS throttles and
// coalesces timers, and a drifting countdown shows the wrong second for a
// whole second at a time.
function tick() {
  render(false);
  if (tickTimer) clearTimeout(tickTimer);
  var delay = 1000 - (Date.now() % 1000) + 15;
  tickTimer = setTimeout(tick, delay);
}

var lastRefresh = 0;

function refresh(reason, minGapMs) {
  var now = Date.now();
  if (minGapMs && (now - lastRefresh) < minGapMs) { render(false); return; }
  lastRefresh = now;
  loadTimes();
  updateWorker();
  render(false);
}

/* --- service worker ---
   Registered only over https (and on localhost, for testing): on http or
   file:// registration throws, and an unhandled throw here would take the whole
   script — and the screen — down with it. The app is fully usable with no
   worker at all. */
var swReg = null;
var hadController = false;
var reloading = false;

function updateWorker() {
  if (!swReg || typeof swReg.update !== 'function') return;
  try { swReg.update()['catch'](function () {}); } catch (e) {}
}

function registerWorker() {
  if (!('serviceWorker' in navigator)) return;
  var h = location.hostname;
  var secure = (location.protocol === 'https:' || h === 'localhost' || h === '127.0.0.1');
  if (!secure) return;
  try {
    hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      swReg = reg;
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          // Normally sw.js calls skipWaiting() itself; this covers a worker that
          // finished installing while the page was hidden and got stuck waiting.
          if (w.state === 'installed' && navigator.serviceWorker.controller) {
            try { w.postMessage('SKIP_WAITING'); } catch (e) {}
          }
        });
      });
    })['catch'](function () { /* no worker: the page still works */ });

    // A new worker taking over means new files. There is no audio and no state
    // to lose here, so reloading immediately is the honest thing to do — but
    // only if something was controlling us before, otherwise the very first
    // registration would reload the page on every fresh install.
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloading) return;
      reloading = true;
      location.reload();
    });
  } catch (e) { /* ignore */ }
}

function boot() {
  // Paint from whatever is already on the device before touching the network:
  // stored copy first (it came from times.json), else the compiled-in seed.
  data = readStore() || decodeSeed();
  render(true);
  tick();

  registerWorker();
  refresh('load', 0);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    // Never trust a counter across a background stint — iOS freezes timers and
    // can hand the page back hours later. Recompute from the clock.
    render(true);
    tick();
    refresh('foreground', 60000);
  });

  // bfcache: on iOS a back-swipe can restore the page with its timers stopped.
  window.addEventListener('pageshow', function (e) {
    if (e && e.persisted) { render(true); tick(); refresh('pageshow', 60000); }
  });

  window.addEventListener('online', function () { refresh('online', 0); });

  window.setInterval(function () { refresh('interval', 0); }, 15 * 60 * 1000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
