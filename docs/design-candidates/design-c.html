<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Namaz — El-Feth</title>

<!-- The service worker looks for this exact string before it lets a response
     replace the cached shell. Without it, hotel wifi can cache a login page
     over the app. See sw.js -> SHELL_MARKER. -->
<meta name="app-id" content="elfeth-prayer-times">

<meta name="description" content="Orarul rugăciunilor — Moscheea El-Feth, Tilburg.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent = the page runs under the status bar, so every safe-area
     inset below is load-bearing, not decoration. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Namaz">
<!-- iOS will happily turn "19:38" into a phone link. It must not. -->
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">

<style>
:root{
  --bg:#090B10;
  --elev:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.085);
  --tx:#F3F6FA;
  --tx-2:#A2ABBA;
  --tx-3:#6E7787;
  --mint:#31D6A8;
  --sky:#4FA9F2;
  --violet:#9C8CFB;
}

*{box-sizing:border-box;margin:0;padding:0}

html{
  background:var(--bg);
  /* iOS inflates text in landscape without this. */
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}

body{
  background:var(--bg);
  color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.35;
  letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  /* Almost every figure on this screen is a clock. Tabular digits stop the
     countdown from reshuffling its own layout sixty times a minute. */
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  /* No rubber band: behind the page is a different colour and it shows. */
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  min-height:100vh;      /* order matters: old iOS stops here */
  min-height:100dvh;     /* 15.4+ takes this one */
}

[hidden]{display:none !important}

/* Ambient light. Three very flat radials; no filters, nothing to composite. */
.bg{
  position:fixed;left:0;right:0;top:0;bottom:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 52% at 50% -10%, rgba(49,214,168,.11), rgba(49,214,168,0) 62%),
    radial-gradient(85% 40% at 92% 10%, rgba(79,169,242,.075), rgba(79,169,242,0) 60%),
    radial-gradient(95% 45% at 2% 104%, rgba(156,140,251,.07), rgba(156,140,251,0) 60%);
}

.wrap{
  position:relative;z-index:1;
  max-width:460px;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;
  min-height:100vh;min-height:100dvh;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:calc(env(safe-area-inset-left,0px) + 18px);
  padding-right:calc(env(safe-area-inset-right,0px) + 18px);
}

.eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.17em;
  text-transform:uppercase;color:var(--tx-2);
}

/* ---------- header ---------- */
.top{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:12px;row-gap:1px}
.date{font-size:15.5px;font-weight:600;letter-spacing:-.014em}
.clock{font-size:15.5px;font-weight:600;color:var(--tx-2);text-align:right}
.place{font-size:11.5px;font-weight:500;color:var(--tx-3)}
.tzn{font-size:11.5px;font-weight:500;color:var(--tx-3);text-align:right}

/* ---------- the dial ---------- */
.hero{display:flex;justify-content:center}
.dial{position:relative;width:min(69vw,272px);height:min(69vw,272px)}
.dial svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block;overflow:visible}

.trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:9}
.arc{fill:none;stroke-width:9;stroke-linecap:round;
     filter:drop-shadow(0 0 7px rgba(49,214,168,.32));
     transition:stroke-dashoffset 1s linear}
/* The outer hairline sweeps once a minute. It is the only thing on screen that
   visibly moves, and it is telling the truth while it moves. */
.sec{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.5;stroke-linecap:round;
     transition:stroke-dashoffset .95s linear}
.head{fill:#9DF3DD;filter:drop-shadow(0 0 6px rgba(143,240,214,.85))}
/* Coming back from the background, the correct values are far from the ones on
   screen; the catch-up must be instant, not a one-second slide. */
.nomo .arc,.nomo .sec,.nomo .bar i,.nomo .prog i{transition:none !important}

.face{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
      text-align:center;padding:0 15%}
.nx{margin-top:7px;display:flex;align-items:baseline;justify-content:center;gap:6px;white-space:nowrap}
.nx-n{font-size:17px;font-weight:600;letter-spacing:-.015em}
.nx-t{font-size:13px;font-weight:500;color:var(--tx-2)}
.cd{margin-top:2px;font-size:clamp(38px,12.6vw,52px);font-weight:600;
    letter-spacing:-.028em;line-height:1.08}
.cd-sub{margin-top:3px;font-size:12.5px;font-weight:500;color:var(--tx-2)}

/* ---------- the window that is open now ---------- */
.card{background:var(--elev);border:1px solid var(--line);border-radius:18px;padding:11px 14px 13px}
.l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rem{font-size:12.5px;font-weight:600;color:var(--mint);white-space:nowrap}
.nw-name{margin-top:4px;display:flex;align-items:baseline;gap:7px}
.nw-name .nm{font-size:19px;font-weight:600;letter-spacing:-.018em}
.nw-name .t2{font-size:13px;font-weight:500;color:var(--tx-2)}
.bar{margin-top:10px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;
       background:linear-gradient(90deg,var(--mint),var(--sky));
       box-shadow:0 0 10px rgba(49,214,168,.4);
       transition:width 1s linear}
.ends{margin-top:6px;display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--tx-2)}
/* the sunrise -> dhuhr hole in the day: same card, no accent, no pretending */
.card.gap .rem{color:var(--tx-2)}
.card.gap .bar i{background:linear-gradient(90deg,#5F6878,#8A93A3);box-shadow:none}
.chip{margin-top:11px;display:inline-flex;align-items:center;gap:6px;
      font-size:11.5px;font-weight:600;color:#C9BFFF;
      background:rgba(156,140,251,.13);border:1px solid rgba(156,140,251,.22);
      border-radius:99px;padding:4px 10px}

/* ---------- the day ---------- */
.tl{display:flex;flex-direction:column;gap:4px}
.tl-head{padding:0 2px}
.rows{position:relative}
.rows:before{content:"";position:absolute;left:11px;top:20px;bottom:20px;width:1px;
  background:linear-gradient(180deg,rgba(255,255,255,0),var(--line) 10%,var(--line) 90%,rgba(255,255,255,0))}

.tr{position:relative;display:grid;grid-template-columns:22px 1fr auto;align-items:center;
    column-gap:8px;padding:5px 10px 9px 0;border-radius:13px}
.dot{justify-self:center;width:7px;height:7px;border-radius:50%;
     background:var(--tx-3);box-shadow:0 0 0 4px var(--bg)}
.mn{min-width:0;display:flex;align-items:baseline;gap:7px}
.nm{font-size:15.5px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.t2{font-size:12px;font-weight:500;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
     padding:2.5px 6px;border-radius:6px;white-space:nowrap}
.tag.nx{color:#9FE8D2;background:rgba(49,214,168,.12);border:1px solid rgba(49,214,168,.22)}
.tag.vl{color:#C0B4FF;background:rgba(156,140,251,.11);border:1px solid rgba(156,140,251,.2)}
.rt{text-align:right}
.rg{font-size:14px;font-weight:600;white-space:nowrap}
.rg .ar{color:var(--tx-3);font-weight:500;margin:0 3px}
.du{font-size:10.5px;font-weight:500;color:var(--tx-3);margin-top:1px}

.tr.past{opacity:.6}
.tr.past .nm{font-weight:500}
.tr.cur{background:linear-gradient(90deg,rgba(49,214,168,.13),rgba(49,214,168,.025))}
.tr.cur .dot{width:9px;height:9px;background:var(--mint);
             box-shadow:0 0 0 4px var(--bg),0 0 12px rgba(49,214,168,.75)}
.tr.next .dot{width:9px;height:9px;background:var(--bg);border:2px solid var(--mint);
              box-shadow:0 0 0 4px var(--bg)}
.tr.vl .dot{background:var(--bg);border:1.5px solid rgba(156,140,251,.6)}
.tr.vl.cur{background:linear-gradient(90deg,rgba(156,140,251,.14),rgba(156,140,251,.025))}
.tr.vl.cur .dot{background:var(--violet);border-color:var(--violet);
                box-shadow:0 0 0 4px var(--bg),0 0 12px rgba(156,140,251,.7)}

.prog{position:absolute;left:22px;right:10px;bottom:4px;height:2px;border-radius:2px;
      background:rgba(255,255,255,.07);display:none}
.tr.cur .prog{display:block}
.prog i{display:block;height:100%;width:0;border-radius:2px;background:var(--mint);
        transition:width 1s linear}
.tr.vl.cur .prog i{background:var(--violet)}

/* Sunrise is a boundary, so it gets a boundary's weight: a node, not a row. */
.sun{position:relative;display:grid;grid-template-columns:22px 1fr;align-items:center;
     column-gap:8px;padding:2px 10px 4px 0}
.sdot{justify-self:center;width:5px;height:5px;border-radius:50%;background:var(--bg);
      border:1px solid rgba(255,255,255,.3);box-shadow:0 0 0 3px var(--bg)}
.stx{font-size:11px;font-weight:500;color:var(--tx-3)}
.stx b{font-weight:600;color:var(--tx-2)}

footer{margin-top:auto;padding-top:7px;text-align:center;font-size:10.5px;
       font-weight:500;color:var(--tx-3);letter-spacing:.01em}

/* Only reachable if the built-in snapshot is broken too. Say it plainly and
   keep retrying; never an empty screen. */
.fail-t{margin-top:5px;font-size:14px;font-weight:500;color:var(--tx-2)}
.nodata .hero,.nodata .now,.nodata .tl{display:none}

@media (max-width:360px){
  /* the violet dot and rail already say "voluntary"; the label is what pushes
     Teheccüd into an ellipsis on a 320px phone, so it goes first */
  .tag.vl{display:none}
}
@media (max-width:344px){
  .nm{font-size:14.5px}
  .t2{font-size:11px}
  .rg{font-size:13px}
  .nw-name .nm{font-size:17.5px}
}

@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.anim .top{animation:rise .55s both cubic-bezier(.22,.8,.2,1)}
.anim .hero{animation:rise .55s .05s both cubic-bezier(.22,.8,.2,1)}
.anim .now{animation:rise .55s .11s both cubic-bezier(.22,.8,.2,1)}
.anim .tl{animation:rise .55s .17s both cubic-bezier(.22,.8,.2,1)}
.anim footer{animation:rise .55s .23s both cubic-bezier(.22,.8,.2,1)}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none !important;transition:none !important}
}
</style>
</head>

<main class="wrap" id="app">

  <header class="top">
    <div class="date" id="dDate">&nbsp;</div>
    <div class="clock" id="dClock">--:--</div>
    <div class="place">Moscheea El-Feth · Tilburg</div>
    <div class="tzn">ora Olandei</div>
  </header>

  <section class="hero">
    <div class="dial">
      <svg viewBox="0 0 220 220" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="arcg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#31D6A8"/>
            <stop offset="55%" stop-color="#3FC8C4"/>
            <stop offset="100%" stop-color="#4FA9F2"/>
          </linearGradient>
        </defs>
        <g transform="rotate(-90 110 110)">
          <circle class="sec" id="secArc" cx="110" cy="110" r="105"/>

      <div class="face">

        <div class="cd" id="cd" role="timer" aria-live="off">--:--</div>
        <div class="cd-sub" id="cdSub">&nbsp;</div>
      </div>
    </div>
  </section>

  <section class="card now" id="nowCard">
    <div class="l1">
      <span class="eyebrow" id="nwLabel">Deschis acum</span>
      <span class="rem" id="nwRem"></span>
    </div>
    <div class="nw-name"><span class="nm" id="nwName">—</span><span class="t2" id="nwTr"></span></div>
    <div class="bar"><i id="nwBar"></i></div>
    <div class="ends"><span id="nwFrom">--:--</span><span id="nwTo">--:--</span></div>
    <div class="chip" id="nwChip" hidden></div>
  </section>

  <section class="tl">
    <div class="tl-head"><span class="eyebrow">Programul zilei</span></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="card fail" id="fail" hidden>
    <div class="eyebrow">Orarul nu s-a încărcat</div>
    <div class="fail-t">Se reîncearcă automat.</div>
  </section>

  <footer id="foot">Stedekestraat 27, Tilburg</footer>
</main>

// travels and the mosque does not.
function zonedParts(ms){

    asr: base + e.asr * MIN,
    maghrib: base + e.maghrib * MIN,

// neighbours: the start of the last third of the night (which begins at

  // interval - nothing here is borrowed from a neighbouring day. That is what

    // that adhan is tomorrow's fajr, which is not on today's list, so nothing

    if (r.start === next.at) { r.state = 'next'; continue; }

  var h = Math.floor(mins / 60), m = mins % 60;
  if (h > 0) return h + ' h ' + pad2(m);
  return m + ' min';

  var h = Math.floor(mins / 60), m = mins % 60;

function romanianDate(z){
  var wd = new Date(Date.UTC(z.y, z.m - 1, z.d)).getUTCDay();
  var s = WEEKDAYS[wd] + ', ' + z.d + ' ' + MONTHS[z.m - 1] + ' ' + z.y;
  return s.charAt(0).toUpperCase() + s.slice(1);
}

var $ = function(id){ return document.getElementById(id); };
var app = $('app'), rowsEl = $('rows');
var arc = $('arc'), secArc = $('secArc'), head = $('head');
var R_ARC = 94, R_SEC = 105;
var C_ARC = 2 * Math.PI * R_ARC, C_SEC = 2 * Math.PI * R_SEC;

var times = null;         // the schedule in force
var rowEls = {};          // id -> the bits of one timeline row
var sunT = null;
var lastSecFrac = 2;      // forces a clean start on the first sweep
var firstPaint = true;

function setText(el, s){ if (el && el.__t !== s) { el.__t = s; el.textContent = s; } }
function setW(el, frac){
  if (!(frac >= 0)) frac = 0;                 // also catches NaN from a zero-length window
  var p = Math.max(0, Math.min(1, frac)) * 100;
  var s = p.toFixed(2) + '%';
  if (el.__w !== s) { el.__w = s; el.style.width = s; }
}

function buildRows(){
  rowsEl.innerHTML = '';
  rowEls = {};
  for (var i = 0; i < ORDER.length; i++) {
    var id = ORDER[i];
    var el = document.createElement('div');
    el.className = 'tr' + (id === 'tahajjud' ? ' vl' : '');
    el.innerHTML =
      '<span class="dot"></span>' +
      '<div class="mn"><span class="nm">' + NAMES[id][0] + '</span>' +
      '<span class="t2">' + NAMES[id][1] + '</span>' +
      (id === 'tahajjud'
        ? '<span class="tag vl">voluntar</span>'
        : '<span class="tag nx" hidden>urmează</span>') + '</div>' +
      '<div class="rt"><div class="rg"><span class="a">--:--</span>' +
      '<span class="ar">&#8594;</span><span class="b">--:--</span></div>' +
      '<div class="du"></div></div>' +
      '<span class="prog"><i></i></span>';
    rowsEl.appendChild(el);
    rowEls[id] = {
      root: el,
      a: el.querySelector('.a'), b: el.querySelector('.b'),
      du: el.querySelector('.du'), nx: el.querySelector('.tag.nx'),
      prog: el.querySelector('.prog i')
    };
    if (id === 'fajr') {
      var sun = document.createElement('div');
      sun.className = 'sun';
      sun.innerHTML = '<span class="sdot"></span><span class="stx">Răsărit <b id="sunT">--:--</b>' +
                      ' · nicio fereastră până la Dhuhr</span>';
      rowsEl.appendChild(sun);
      sunT = sun.querySelector('#sunT');
    }
  }
}

function setArc(frac){
  arc.style.strokeDasharray = C_ARC;
  arc.style.strokeDashoffset = (C_ARC * (1 - frac)).toFixed(2);
  var ang = (frac * 360 - 90) * Math.PI / 180;
  head.setAttribute('cx', (110 + R_ARC * Math.cos(ang)).toFixed(2));
  head.setAttribute('cy', (110 + R_ARC * Math.sin(ang)).toFixed(2));
}

function setSeconds(now){
  var frac = (now % 60000) / 60000;
  secArc.style.strokeDasharray = C_SEC;
  // At the top of a minute the sweep restarts. Jump it back with the transition
  // off, otherwise it spends a second unwinding anticlockwise.
  if (frac < lastSecFrac) {
    secArc.style.transition = 'none';
    secArc.style.strokeDashoffset = C_SEC;
    void secArc.getBoundingClientRect();
    secArc.style.transition = '';
  }
  lastSecFrac = frac;
  secArc.style.strokeDashoffset = (C_SEC * (1 - frac)).toFixed(2);
}

// Suppresses every transition across the repaint that follows. Used when the
// app returns from the background: iOS froze the timers, so the new values are
// minutes or hours away from the drawn ones and must not be animated into place.
var nomoTimer = 0;
function stopMotion(){
  document.documentElement.className = 'nomo';
  clearTimeout(nomoTimer);
  nomoTimer = setTimeout(function(){ document.documentElement.className = ''; }, 80);
  lastSecFrac = 2;
}

function paint(st){
  // --- the countdown, which is the whole point of the screen ---
  setText($('nxName'), NAMES[st.next.id][0]);
  setText($('nxTr'), NAMES[st.next.id][1]);
  setText($('cd'), fmtCountdown(st.next.at - st.now));
  setText($('cdSub'), 'adhan ' + (st.nextTomorrow ? 'mâine ' : '') + 'la ' + clockHM(st.next.at));
  setArc(st.ring);
  setSeconds(st.now);

  // --- the window that is open right now ---
  var card = $('nowCard'), c = st.current;
  if (c && c.gap) {
    if (card.className !== 'card now gap') card.className = 'card now gap';
    setText($('nwLabel'), 'Nicio fereastră deschisă');
    setText($('nwName'), 'Între răsărit și Dhuhr');
    setText($('nwTr'), '');
    setText($('nwRem'), 'încă ' + fmtLeft(c.end - st.now));
  } else if (c) {
    if (card.className !== 'card now') card.className = 'card now';
    setText($('nwLabel'), 'Deschis acum');
    setText($('nwName'), NAMES[c.id][0]);
    setText($('nwTr'), NAMES[c.id][1]);
    setText($('nwRem'), 'mai rămân ' + fmtLeft(c.end - st.now));
  }
  if (c) {
    // Before fajr, the isha still running began last night. Saying so is the
    // difference between "that clashes with the list below" and "of course".
    var cz = zonedParts(c.start);
    var sameDay = cz.y === st.z.y && cz.m === st.z.m && cz.d === st.z.d;
    setText($('nwFrom'), (sameDay ? '' : 'aseară ') + clockHM(c.start));
    setText($('nwTo'), clockHM(c.end));
    setW($('nwBar'), (st.now - c.start) / (c.end - c.start));
  }

  var chip = $('nwChip');
  if (st.tahajjud) {
    setText(chip, 'Tahajjud e deschis · până la ' + clockHM(st.tahajjud.end));
    chip.hidden = false;
  } else if (!chip.hidden) {
    chip.hidden = true;
  }

  // --- the day ---
  for (var i = 0; i < st.rows.length; i++) {
    var r = st.rows[i], e = rowEls[r.id];
    if (!e) continue;
    setText(e.a, clockHM(r.start));
    setText(e.b, clockHM(r.end));
    setText(e.du, fmtSpan(r.end - r.start));
    var cls = 'tr' + (r.id === 'tahajjud' ? ' vl' : '');
    if (r.state === 'cur') cls += ' cur';
    else if (r.state === 'next') cls += ' next';
    else if (r.state === 'past') cls += ' past';
    if (e.root.className !== cls) e.root.className = cls;
    if (e.nx) e.nx.hidden = r.state !== 'next';
    if (r.state === 'cur') setW(e.prog, (st.now - r.start) / (r.end - r.start));
  }
  if (sunT) setText(sunT, clockHM(st.day.sunrise));

  if (firstPaint) {
    firstPaint = false;
    var gen = times && times.generated ? String(times.generated) : '';
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(gen);
    setText($('foot'), 'Stedekestraat 27, Tilburg' +
      (m ? ' · orar actualizat ' + (+m[3]) + ' ' + MONTHS_ABBR[+m[2] - 1] + ' ' + m[1] : ''));
    // The ring fills once, from empty, the first time it is drawn.
    if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var target = arc.style.strokeDashoffset;
      arc.style.transition = 'none';
      arc.style.strokeDashoffset = C_ARC;
      void arc.getBoundingClientRect();
      arc.style.transition = 'stroke-dashoffset .95s cubic-bezier(.22,.8,.2,1)';
      arc.style.strokeDashoffset = target;
      setTimeout(function(){ arc.style.transition = ''; }, 1000);
    }
    document.body.className = 'anim';
  }
}

function tick(){
  // The clock and the date need no schedule, so they are painted first and
  // keep running even if times.json never arrives.
  var now = Date.now();
  setText($('dDate'), romanianDate(zonedParts(now)));
  setText($('dClock'), clockHM(now));
  if (!times) { showFail(true); return; }
  var st = computeState(times, now);
  if (!st) { showFail(true); return; }
  showFail(false);
  paint(st);
}

function showFail(on){
  $('fail').hidden = !on;
  if (on) { if (app.className !== 'wrap nodata') app.className = 'wrap nodata'; }
  else if (app.className !== 'wrap') app.className = 'wrap';
}

// Self-correcting: each tick is scheduled for the next whole second rather than
// 1000ms from wherever the last one drifted to.
var tickTimer = 0;
function loop(){
  clearTimeout(tickTimer);
  var delay = 1000 - (Date.now() % 1000) + 10;
  tickTimer = setTimeout(function(){ tick(); loop(); }, delay);
}

function usable(d){
  return !!(d && d.days && typeof d.days === 'object' && d.days['01-01'] &&
            typeof d.days['01-01'].fajr === 'number');
}

// Built-in copy first, so the very first frame is already correct and the app is
// never blank - not while the network hangs, not on a cold offline start.
function loadSnapshot(){
  try {
    var raw = $('snapshot').textContent;
    var d = JSON.parse(raw);
    if (usable(d)) { times = d; buildRows(); tick(); return true; }
  } catch (e) {}
  return false;
}

// Then the real file, which the scheduled scrape keeps up to date. Two paths
// because the candidate is previewed from candidates/ but ships at the root.
var SOURCES = ['./times.json', '../times.json'];

function fetchTimes(){
  if (typeof fetch !== 'function') return;
  var tried = 0;
  var attempt = function(){
    if (tried >= SOURCES.length) return;
    var url = SOURCES[tried++];
    var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
    var killer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 6000);
    fetch(url + '?t=' + Date.now(), {
      cache: 'no-store',
      credentials: 'same-origin',
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function(d){
      clearTimeout(killer);
      if (!usable(d)) throw new Error('unusable');
      times = d;
      if (!rowEls.fajr) buildRows();
      tick();
    })['catch'](function(){
      clearTimeout(killer);
      attempt();
    });
  };
  attempt();
}

// ---------------------------------------------------------------------------
// service worker
// ---------------------------------------------------------------------------
// https only (it cannot register anywhere else and would throw), and the page
// has to work perfectly when there is none: iOS clears storage for apps it
// decides are idle, and file:// and http:// previews have no worker at all.
var swReg = null, reloading = false;
function initSW(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  var hadController = !!navigator.serviceWorker.controller;

  navigator.serviceWorker.register('./sw.js').then(function(reg){
    swReg = reg;
    if (reg.waiting) { try { reg.waiting.postMessage('SKIP_WAITING'); } catch (e) {} }
    reg.addEventListener('updatefound', function(){
      var w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', function(){
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          try { w.postMessage('SKIP_WAITING'); } catch (e) {}
        }
      });
    });
  })['catch'](function(){});

  navigator.serviceWorker.addEventListener('controllerchange', function(){
    // The very first worker taking control is not an update, it is the install.
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
}

function checkForUpdate(){
  fetchTimes();
  if (swReg && swReg.update) { try { swReg.update(); } catch (e) {} }
}

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------
if (!loadSnapshot()) buildRows();
tick();          // first frame now, not a second from now
fetchTimes();
loop();
initSW();

// iOS freezes timers in a backgrounded tab and in an installed app that has
// been swiped away. On the way back, nothing on screen can be trusted: recompute
// from the clock, and do not animate the catch-up.
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') { stopMotion(); tick(); checkForUpdate(); }
});
window.addEventListener('pageshow', function(){ stopMotion(); tick(); checkForUpdate(); });
window.addEventListener('online', checkForUpdate);
window.addEventListener('focus', function(){ tick(); });
setInterval(checkForUpdate, 15 * 60 * 1000);
})();
</script>
</body>
</html>
