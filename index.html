     behind the home indicator; every edge is then paid back with env() padding. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070C">

     our own background instead of over a grey bar, which is the whole point of a
     near-black design; it only works because the safe-area padding below is real. -->

<meta name="mobile-web-app-capable" content="yes">

     request with 200 and text/html, which is indistinguishable from this page by
     headers alone - but it will not carry this marker. Do not remove. -->
<meta name="app-id" content="elfeth-prayer-times">

<title>Namaz</title>

<style>
/* ---------------------------------------------------------------------------
   Near-black ink, one accent, hairlines, and type doing all of the work.
   There is nothing on this screen that is not a time or the name of a prayer.
   --------------------------------------------------------------------------- */
:root{
  --ink:       #05070C;   /* page floor - almost black, very slightly blue */
  --ink-2:     #0A0F1A;   /* the bottom of the page gradient */
  --accent:    #8AAEFF;   /* the single accent. Nothing else is coloured. */
  --accent-30: rgba(138,174,255,.30);
  --accent-14: rgba(138,174,255,.14);
  --glow:      rgba(126,160,255,.16);

  --text:      #F2F5FA;
  --text-2:    rgba(238,243,252,.66);
  --text-3:    rgba(238,243,252,.46);
  --text-4:    rgba(238,243,252,.30);

  --line:      rgba(255,255,255,.075);
  --glass:     rgba(255,255,255,.042);
  --glass-line:rgba(255,255,255,.085);
}

*{ box-sizing:border-box; margin:0; padding:0; }

html{
  background:var(--ink);            /* rubber-band overscroll shows THIS, so it must match */
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  color:var(--text);
  /* -apple-system first: on iPhone this IS SF Pro, and it is most of the reason
     the app reads as native rather than as a web page. */
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-synthesis:none;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none; -webkit-user-select:none;
  /* Kills double-tap-to-zoom. An installed standalone window has no address bar
     and no reload button, so a stray double tap that zooms is a state he cannot
     get out of without force-quitting the app. */
  touch-action:manipulation;
  min-height:100vh;
  min-height:100dvh;
}

/* The aura lives on a fixed layer rather than on body's background, because iOS
   Safari does not honour background-attachment:fixed - it sizes the gradient to
   the whole document, which puts the pool of light in the wrong place the moment
   the page is tall enough to scroll. One soft pool of accent behind the
   countdown, a cool floor light at the bottom, a slow ink gradient. That is the
   entire depth budget. */
.sky{
  position:fixed; left:0; right:0; top:0; bottom:0; z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(125% 46% at 50% 6%,   var(--glow) 0%, rgba(126,160,255,0) 62%),
    radial-gradient(90% 38% at 50% 100%,  rgba(138,174,255,.05) 0%, rgba(138,174,255,0) 70%),
    linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
}

/* Every clock and countdown on screen. Both properties, because older iOS
   honours font-feature-settings and newer ones font-variant-numeric. */
.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

.app{
  max-width:560px; margin:0 auto;
  /* The four insets. In a Safari tab they are 0 and the fallbacks do the work. */
  padding:calc(env(safe-area-inset-top, 0px)  + 18px) calc(env(safe-area-inset-right, 0px) + 24px)
          calc(env(safe-area-inset-bottom,0px) + 26px) calc(env(safe-area-inset-left,  0px) + 24px);
  min-height:100vh;
  min-height:100dvh;
  display:flex; flex-direction:column;
}

/* ------------------------------------------------------------------- hero -- */
.hero{
  text-align:center;
  padding:clamp(20px, 4.2vh, 56px) 0 clamp(20px, 3.8vh, 48px);
  padding:clamp(20px, 4.2svh, 56px) 0 clamp(20px, 3.8svh, 48px);
}
.eyebrow{
  font-size:10.5px; font-weight:650; letter-spacing:.19em; text-transform:uppercase;
  color:var(--text-3);
}
.hero .eyebrow{ color:var(--accent); opacity:.85; }
.next-name{
  margin-top:10px; font-size:clamp(21px,6vw,26px); font-weight:600;
  letter-spacing:-.01em; color:var(--text);
}
.count{
  margin-top:2px;
  font-size:clamp(50px, 16vw, 84px);
  line-height:1.05;
  font-weight:300;                 /* SF Pro Light: the iOS Weather temperature look */
  letter-spacing:-.035em;
  color:var(--text);
  text-shadow:0 0 44px rgba(138,174,255,.18);   /* glass catching light, not neon */
}
.at{ margin-top:7px; font-size:14px; color:var(--text-2); }

/* ------------------------------------------------- the window open right now */
.card{
  border:1px solid var(--glass-line);
  border-radius:20px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  backdrop-filter:blur(22px) saturate(140%);
  padding:15px 17px 16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055), 0 14px 40px rgba(0,0,0,.35);
}
.card-top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.open-name{ margin-top:8px; font-size:20px; font-weight:600; letter-spacing:-.01em; }
.remain{ font-size:12.5px; color:var(--text-2); flex:none; white-space:nowrap; }

.bar{ margin-top:14px; display:flex; align-items:center; gap:10px; }
.bar-end{ font-size:12px; color:var(--text-3); flex:none; }
.track{
  position:relative; flex:1 1 auto; height:3px; border-radius:2px;
  background:rgba(255,255,255,.085);
}
.fill{
  position:absolute; left:0; top:0; height:100%; width:0; border-radius:2px;
  background:linear-gradient(90deg, var(--accent-30), var(--accent));
}
.head-dot{
  position:absolute; top:50%; left:0; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
  border-radius:50%; background:#fff;
  box-shadow:0 0 0 3px rgba(138,174,255,.18), 0 0 14px 2px rgba(138,174,255,.55);
}
/* Sunrise to Dhuhr: nothing is open, and the bar says so by going dashed rather
   than solid. Same geometry, so the head dot stays exactly where it was. */
.card.gap .track{
  background:repeating-linear-gradient(90deg,
    rgba(255,255,255,.14) 0 3px, rgba(255,255,255,0) 3px 7px);
}
.card.gap .fill{
  background:repeating-linear-gradient(90deg,
    rgba(138,174,255,.56) 0 3px, rgba(138,174,255,0) 3px 7px);
}
.card.gap .head-dot{ background:var(--accent); box-shadow:0 0 12px 1px rgba(138,174,255,.45); }
.card.gap .open-name{ color:var(--text-2); font-weight:500; }

/* ------------------------------------------------------------------ list -- */
.list{
  flex:1 1 auto; list-style:none;
  margin-top:clamp(16px, 3vh, 34px);
  margin-top:clamp(16px, 3svh, 34px);
  display:flex; flex-direction:column; justify-content:center;
}
.row{
  position:relative; display:flex; align-items:center; gap:13px;
  padding:clamp(11px, 1.9vh, 18px) 2px clamp(11px, 1.9vh, 18px) 0;
  padding:clamp(11px, 1.9svh, 18px) 2px clamp(11px, 1.9svh, 18px) 0;
  border-top:1px solid var(--line);
}
.row.first{ border-top:none; }
.dot{
  flex:none; width:7px; height:7px; border-radius:50%;
  background:transparent; box-shadow:inset 0 0 0 1px var(--text-4);
}
.row.next .dot{ box-shadow:inset 0 0 0 1.5px rgba(138,174,255,.56); }
.row.on   .dot{ background:var(--accent); box-shadow:0 0 12px 2px rgba(138,174,255,.55); }
.row.past .dot{ box-shadow:inset 0 0 0 1px rgba(238,243,252,.13); }
.r-name{ flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
         font-size:18px; font-weight:600; letter-spacing:-.01em; }
.r-int{ flex:none; font-size:16px; color:var(--text-2); }

.row.past .r-name{ color:var(--text-3); font-weight:500; }
.row.past .r-int{ color:var(--text-4); }
.row.on .r-int{ color:var(--accent); font-weight:500; }
.row.on{
  /* the open window gets light, not a box */
  background:linear-gradient(90deg, var(--accent-14) 0%, rgba(138,174,255,0) 58%);
  box-shadow:inset 2px 0 0 var(--accent);
  border-radius:0 12px 12px 0;
  margin-left:-12px; padding-left:12px; width:calc(100% + 12px);
}
.row.next .r-name, .row.next .r-int{ color:var(--text); }

/* Tahajjud is voluntary and overlaps Isha, so it must never be mistaken for one
   of the five. It sits inset behind a dashed rule and never takes the solid
   accent fill, which is the whole distinction - no badge needed. */
.row.vol{ padding-left:14px; }
.row.vol .r-name{ font-size:16.5px; font-weight:500; color:var(--text-2); }
.row.vol .rule{
  position:absolute; left:3px; top:9px; bottom:9px; width:0;
  border-left:1px dashed var(--accent-30);
}
.row.vol.on{ background:none; box-shadow:none; margin-left:0; padding-left:14px; width:auto; }
.row.vol.on .r-name{ color:var(--text); }
.row.vol.on .rule{ border-left:1px dashed var(--accent); }
.row.vol.on .r-int{ color:rgba(138,174,255,.56); }

/* In the small hours the Isha row shows LAST NIGHT'S window - the one actually
   open - so it has to say so, or it reads as contradicting the Maghrib row
   above it, every night of the year. */
.eve{
  margin-left:8px; font-size:11px; font-weight:500; color:var(--text-4);
  letter-spacing:.02em;
}

.hide{ display:none !important; }
.msg{ padding:48px 0; text-align:center; color:var(--text-2); font-size:14px; line-height:1.65; }

/* One entrance, once. After that only the digits change - nothing that carries
   information ever moves. */
@keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
.app > *{ animation:rise .55s cubic-bezier(.22,.9,.3,1) both; }
.card{ animation-delay:.05s; }
.list{ animation-delay:.1s; }
@media (prefers-reduced-motion:reduce){ .app > *{ animation:none !important; } }

/* Short phones (a 4.7" SE, or Safari with its bars showing). Measured shaves,
   not a redesign - the same information in the same order. */
@media (max-height:700px){
  .hero{ padding:10px 0 12px; }
  .count{ font-size:clamp(40px, 12.5vw, 58px); }
  .at{ margin-top:5px; font-size:13px; }
  .card{ padding:11px 13px 12px; }
  .list{ margin-top:10px; }
  .row{ padding-top:7px; padding-bottom:7px; }
}
</style>
</head>

<body>
<div class="sky"></div>
<div class="app">

  <section class="hero">
    <div class="eyebrow">Next</div>
    <div class="next-name" id="nextName">&nbsp;</div>
    <div class="count num" id="count">&nbsp;</div>
    <div class="at num" id="nextAt">&nbsp;</div>
  </section>

  <section class="card" id="card">
    <div class="card-top">
      <div class="eyebrow" id="openLabel">Now</div>
      <div class="remain num" id="remain">&nbsp;</div>
    </div>
    <div class="open-name" id="openName">&nbsp;</div>
    <div class="bar">
      <div class="bar-end num" id="barFrom">&nbsp;</div>
      <div class="track"><div class="fill" id="fill"></div><div class="head-dot" id="dot"></div></div>
      <div class="bar-end num" id="barTo">&nbsp;</div>
    </div>
  </section>

  <ul class="list" id="list"></ul>
  <div class="msg hide" id="msg"></div>
</div>

<script>
(function(){
'use strict';

/* === core:begin ===========================================================
   Pure time maths. No DOM below this line until core:end - the test harness
   slices exactly this region out and runs the shipped code rather than a copy.
   Verified minute-by-minute across a whole year against an independent
   implementation. Keep it that way.
   ======================================================================== */

var ZONE = 'Europe/Amsterdam';

/* The five obligatory windows in the order the day runs them, plus Tahajjud,
   which is voluntary and deliberately overlaps the end of Isha. */
var NAMES = {
  tahajjud:'Tahajjud', fajr:'Fajr', dhuhr:'Dhuhr',
  asr:'Asr', maghrib:'Maghrib', isha:'Isha'
};

/* Every clock value on screen is derived through this one formatter. The phone's
   own local time is never read: he travels, and the mosque's schedule stays
   Dutch wherever he happens to be standing.
   hourCycle rather than hour12:false - some older engines answer "24" for
   midnight when hour12 is set, which is why zoned() still normalises it. */
var ZP = new Intl.DateTimeFormat('en-GB', {
  timeZone: ZONE,
  year:'numeric', month:'2-digit', day:'2-digit',
  hour:'2-digit', minute:'2-digit', second:'2-digit',
  hourCycle:'h23'
});

function zoned(t){
  var parts = ZP.formatToParts(new Date(t)), o = {}, i;
  for (i = 0; i < parts.length; i++){
    if (parts[i].type !== 'literal') o[parts[i].type] = parts[i].value;
  }
  var h = +o.hour; if (h === 24) h = 0;
  return { y:+o.year, m:+o.month, d:+o.day, h:h, mi:+o.minute, s:+o.second };
}

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(t){ var z = zoned(t); return pad2(z.h) + ':' + pad2(z.mi); }

function offsetAt(t){
  var base = Math.floor(t / 1000) * 1000;      /* zoned() has no ms to give back */
  var z = zoned(base);
  return Date.UTC(z.y, z.m - 1, z.d, z.h, z.mi, z.s) - base;
}

function civilOf(t){ var z = zoned(t); return { y:z.y, m:z.m, d:z.d }; }

function shiftCivil(c, n){
  var d = new Date(Date.UTC(c.y, c.m - 1, c.d) + n * 86400000);
  return { y:d.getUTCFullYear(), m:d.getUTCMonth() + 1, d:d.getUTCDate() };
}

function keyOf(c){ return pad2(c.m) + '-' + pad2(c.d); }

/* 00:00 Amsterdam on a given civil day, as an instant. Correct on both switch
   days because the offset is sampled at 00:00 UTC, which on the March Sunday is
   still CET (the jump happens at 01:00 UTC) and in October is still CEST. */
function localMidnight(c){
  var guess = Date.UTC(c.y, c.m - 1, c.d);
  return guess - offsetAt(guess);
}

/* A stored value is "minutes after 00:00 UTC on this calendar day", so the
   instant is a plain addition and daylight saving is Intl's problem, not ours:
   the same instant re-renders under whatever rule is in force in the year he is
   actually living in, however far the EU moves the switch dates. */
function dayTimes(data, c){
  var rec = data.days[keyOf(c)];
  /* 29 February: the source year was not a leap year, so borrow the 28th. One
     day of at most a minute's drift, once every four years. */
  if (!rec && c.m === 2 && c.d === 29) rec = data.days['02-28'];
  if (!rec) return null;
  var base = Date.UTC(c.y, c.m - 1, c.d);
  return {
    fajr:    base + rec.fajr    * 60000,
    sunrise: base + rec.sunrise * 60000,
    dhuhr:   base + rec.dhuhr   * 60000,
    asr:     base + rec.asr     * 60000,
    maghrib: base + rec.maghrib * 60000,
    isha:    base + rec.isha    * 60000
  };
}

/* The six windows of one civil day.
     Tahajjud  last third of the night -> Fajr   (voluntary, overlaps Isha)
     Fajr      fajr -> sunrise
     [ nothing is open between sunrise and dhuhr ]
     Dhuhr     dhuhr -> asr
     Asr       asr -> maghrib        (standard opinion, shadow factor 1)
     Maghrib   maghrib -> isha
     Isha      isha -> TOMORROW's fajr
   The night that ends at today's Fajr began at YESTERDAY's Maghrib, so this
   needs three days of data to answer for one. */
function windowsFor(data, c){
  var T = dayTimes(data, c);
  var P = dayTimes(data, shiftCivil(c, -1));
  var N = dayTimes(data, shiftCivil(c, 1));
  if (!T || !P || !N) return null;
  /* Rounded to the whole minute so the 02:25 he reads is exactly the instant the
     window opens; an unrounded third would disagree with its own label by up to
     thirty seconds. */
  var third = Math.round((T.fajr - P.maghrib) / 3 / 60000) * 60000;
  return [
    { id:'tahajjud', start:T.fajr - third, end:T.fajr, vol:true },
    { id:'fajr',     start:T.fajr,    end:T.sunrise },
    { id:'dhuhr',    start:T.dhuhr,   end:T.asr },
    { id:'asr',      start:T.asr,     end:T.maghrib },
    { id:'maghrib',  start:T.maghrib, end:T.isha },
    { id:'isha',     start:T.isha,    end:N.fajr }
  ];
}

/* Everything the screen needs, recomputed from the clock alone. Nothing here
   remembers anything between calls, which is what makes it safe to throw away
   and redo after iOS has frozen our timers for six hours in the background. */
function stateAt(data, now){
  var civil = civilOf(now);
  var today = windowsFor(data, civil);
  if (!today) return null;

  /* Yesterday and tomorrow matter: at 00:30 the open window is yesterday's Isha,
     and at 23:50 the next adhan is tomorrow's Fajr. */
  var span = [], k, ws, i;
  for (k = -1; k <= 1; k++){
    ws = windowsFor(data, shiftCivil(civil, k));
    if (ws) for (i = 0; i < ws.length; i++) span.push(ws[i]);
  }

  var current = null, tahajjud = null, next = null;
  for (i = 0; i < span.length; i++){
    var w = span[i];
    if (now >= w.start && now < w.end){
      if (w.vol) tahajjud = w; else current = w;   /* only Isha overlaps Tahajjud */
    }
    /* "Next" is strictly in the future, so at the adhan instant itself the
       countdown has already moved on to the following prayer instead of sitting
       at 00:00:00. Tahajjud has no adhan and is never the answer. */
    if (!w.vol && w.start > now && (!next || w.start < next.start)) next = w;
  }

  var T = dayTimes(data, civil);
  var inGap = (now >= T.sunrise && now < T.dhuhr);

  var rows = [], nextRow = null;
  for (i = 0; i < today.length; i++){
    var r = { id:today[i].id, start:today[i].start, end:today[i].end, vol:!!today[i].vol, state:'' };
    /* In the small hours the window actually open is LAST NIGHT'S Isha, not the
       one that opens this evening. Showing the instance he is standing in keeps
       the row and the card agreeing to the minute - but it has to say so, or
       the row silently contradicts the Maghrib row above it. */
    if (current && current.id === r.id && (current.start !== r.start)){
      r.start = current.start; r.end = current.end; r.carried = true;
    }
    if (now >= r.start && now < r.end) r.state = 'on';
    else if (now >= r.end) r.state = 'past';
    else {
      /* Only an obligatory prayer may wear the "next" marker. Tahajjud has no
         adhan, and in the small hours it is the first future row in the list -
         marking it would leave the list pointing at Tahajjud while the hero
         counts down to Fajr. Two different answers to one question. */
      if (!nextRow && !r.vol) nextRow = r;
      r.state = 'future';
    }
    rows.push(r);
  }
  if (nextRow) nextRow.state = 'next';

  if (!next) return null;   /* cannot happen with three days loaded; cheaper than a crash */

  return {
    now:now, civil:civil, rows:rows, current:current, tahajjud:tahajjud,
    next:next, gap:inGap, sunrise:T.sunrise,
    tomorrow:(next.start >= localMidnight(shiftCivil(civil, 1)))
  };
}

/* 8100000 -> "2h 15m", 540000 -> "9 min", 45000 -> "45 sec". Rounded up, so it
   never reads "0 min" while there is still time left. */
function human(ms){
  var s = Math.ceil(ms / 1000);
  if (s < 60) return s + ' sec';
  var m = Math.ceil(s / 60);
  if (m < 60) return m + ' min';
  var h = Math.floor(m / 60);
  return h + 'h ' + pad2(m % 60) + 'm';
}

/* The countdown: hh:mm:ss above an hour, mm:ss below it, every field padded.
   The padding is not cosmetic. The claim that two adhans are never more than
   ten hours apart at this latitude is false - the Isha->Fajr gap is ten hours
   or more on 144 nights of the year and reaches 13h05 on 20 December - so an
   unpadded hour would change the string's LENGTH every winter evening. It does
   still switch from mm:ss to hh:mm:ss as the last hour opens; that one is
   deliberate and harmless, because the number is centred and grows outwards
   from the middle rather than sliding sideways. */
function clockdown(ms){
  var s = Math.max(0, Math.ceil(ms / 1000));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), q = s % 60;
  return h > 0 ? (pad2(h) + ':' + pad2(m) + ':' + pad2(q)) : (pad2(m) + ':' + pad2(q));
}

/* === core:end ============================================================ */

/* ------------------------------------------------------------------ DOM ---- */
var $ = function(id){ return document.getElementById(id); };
var el = {
  nextName:$('nextName'), count:$('count'), nextAt:$('nextAt'),
  card:$('card'), openLabel:$('openLabel'), openName:$('openName'), remain:$('remain'),
  barFrom:$('barFrom'), barTo:$('barTo'), fill:$('fill'), dot:$('dot'),
  list:$('list'), msg:$('msg')
};

/* Writing to the DOM once a second is free only if we do not actually write.
   Every setter is a no-op when the string has not changed. */
function setText(node, s){ if (node.__v !== s){ node.__v = s; node.textContent = s; } }
function setHTML(node, s){ if (node.__h !== s){ node.__h = s; node.innerHTML = s; } }
function setClass(node, s){ if (node.__c !== s){ node.__c = s; node.className = s; } }
function show(node, on){ if (node.__s !== on){ node.__s = on; node.classList.toggle('hide', !on); } }

/* ----------------------------------------------------------------- render -- */
var DATA = null;

function render(now){
  var st = DATA ? stateAt(DATA, now) : null;
  var ok = !!st;
  show(el.card, ok); show(el.list, ok); show(el.msg, !ok);
  if (!ok){
    setText(el.nextName, ''); setText(el.count, '—'); setText(el.nextAt, '');
    setHTML(el.msg, 'Prayer times not available yet.<br>Retrying automatically.');
    return;
  }

  /* --- the one thing he opens the app for ------------------------------- */
  setText(el.nextName, NAMES[st.next.id]);
  setText(el.count, clockdown(st.next.start - now));
  /* Late in the evening the next adhan is tomorrow's Fajr while the Fajr row in
     the list is dimmed as past. Saying "tomorrow" is the whole difference
     between that reading as considered and reading as a bug. */
  setText(el.nextAt, (st.tomorrow ? 'tomorrow at ' : 'at ') + hhmm(st.next.start));

  /* --- the window open right now ---------------------------------------- */
  var from, to;
  if (st.current){
    setClass(el.card, 'card');
    setText(el.openLabel, 'Now');
    setText(el.openName, NAMES[st.current.id]);
    setText(el.remain, human(st.current.end - now) + ' left');
    from = st.current.start; to = st.current.end;
  } else {
    /* Between sunrise and Dhuhr nothing is open, and saying so plainly is more
       use to him than pretending Fajr is somehow still running. */
    setClass(el.card, 'card gap');
    setText(el.openLabel, 'Now');
    setText(el.openName, 'No window open');
    /* Deliberately blank. The hero directly above already counts down to this
       exact prayer, and the bar below already ends at its time - a third copy
       of the same fact is noise. */
    setText(el.remain, '');
    from = st.gap ? st.sunrise : now; to = st.next.start;
  }
  var frac = Math.min(1, Math.max(0, (now - from) / Math.max(1, to - from)));
  setText(el.barFrom, hhmm(from));
  setText(el.barTo, hhmm(to));
  var pct = (frac * 100).toFixed(2) + '%';
  if (el.fill.__w !== pct){ el.fill.__w = pct; el.fill.style.width = pct; el.dot.style.left = pct; }

  renderList(st);
}

function renderList(st){
  var html = [], i;
  for (i = 0; i < st.rows.length; i++){
    var r = st.rows[i];
    html.push(
      '<li class="row ' + r.state + (r.vol ? ' vol' : '') + (i === 0 ? ' first' : '') + '">' +
        (r.vol ? '<span class="rule"></span>' : '') +
        '<span class="dot"></span>' +
        '<span class="r-name">' + NAMES[r.id] +
          (r.carried ? '<span class="eve">last night</span>' : '') +
        '</span>' +
        '<span class="r-int num">' + hhmm(r.start) + ' → ' + hhmm(r.end) + '</span>' +
      '</li>');
  }
  setHTML(el.list, html.join(''));
}

/* ------------------------------------------------------------------ data --- */
var LS_KEY = 'elfeth.times.v1';

function loadCached(){
  try {
    var s = localStorage.getItem(LS_KEY);
    return s ? JSON.parse(s) : null;
  } catch (e){ return null; }   /* private mode, evicted storage, corrupt JSON */
}
function saveCached(d){
  try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e){}
}

/* A schedule is only allowed to replace the one on screen if it really is a
   schedule. A captive portal answering 200 with a login page parses as nothing,
   but a truncated file could parse as an object with no days in it. */
function usable(d){
  return !!(d && d.days && typeof d.days === 'object' && d.days['01-01'] && d.days['06-15']);
}

/* The schedule compiled into this page, as a last resort. The service worker
   precaches times.json, so this matters in exactly the cases where that has not
   happened yet or no longer holds: a first launch with no network at all, and a
   phone whose storage iOS has quietly evicted for being idle. Without it both
   of those show him an apology instead of the times. */
function loadSeed(){
  try {
    var n = document.getElementById('seed');
    return n ? JSON.parse(n.textContent) : null;
  } catch (e){ return null; }
}

/* Either copy can be the fresher one - the seed is as old as the last deploy,
   the stored copy as old as the last successful fetch - so they are compared,
   not ranked. "generated" is an ISO date, which sorts as a string. */
function pickNewer(a, b){
  if (!a) return b || null;
  if (!b) return a;
  return (String(b.generated || '') > String(a.generated || '')) ? b : a;
}

var fetching = false, lastTry = 0;

function refreshTimes(){
  if (fetching) return;
  fetching = true;
  /* Our own leash. The service worker has a 3s one, but on a first visit - or
     after iOS has evicted the worker, which it does to apps it decides are idle
     - nothing else stands between him and a spinner that never ends. */
  var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  var killed = false;
  var timer = setTimeout(function(){ killed = true; if (ctrl) ctrl.abort(); }, 7000);

  fetch('./times.json', {
    cache:'no-store',
    credentials:'same-origin',
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(r){
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(d){
    if (killed || !usable(d)) return;
    /* A fetch can legitimately answer with something OLDER than what is on
       screen: the service worker serves times.json from Cache Storage, and that
       cache can predate both the copy compiled into this page and the copy in
       localStorage. Replacing blind would quietly put a superseded prayer time
       back on his screen, which is the one failure this app exists to avoid. */
    DATA = pickNewer(DATA, d);
    saveCached(DATA);
    tick();
  })['catch'](function(){
    /* Offline, hung, or a wifi portal. The cached schedule is at worst a day
       stale and is always better than an empty screen, so: say nothing. */
  }).then(function(){ clearTimeout(timer); fetching = false; });
}

/* ------------------------------------------------------- service worker ---- */
var swReg = null;

function nudge(worker){
  if (worker) { try { worker.postMessage('SKIP_WAITING'); } catch (e){} }
}

function setupSW(){
  if (!('serviceWorker' in navigator)) return;
  /* Secure contexts only - registering from file:// or plain http:// throws.
     http://localhost is a secure context BY DEFINITION, and excluding it meant
     the offline and self-update paths could not be exercised locally at all. */
  var h = location.hostname;
  var secure = (location.protocol === 'https:') ||
               h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
  if (!secure) return;

  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloading) return;
    /* The FIRST controllerchange after a brand-new install is just a worker
       taking charge of a page that was already correct; reloading there would
       be a pointless flash. Every one after that means a NEW version replaced
       the old, and the page must be redrawn from the new files.
       The flag therefore has to be raised HERE. Leaving it false meant the
       early return fired for every later update too, and the app silently
       never reloaded itself again for the life of that page. */
    if (!hadController) { hadController = true; return; }
    reloading = true;
    location.reload();   /* nothing here is playing or unsaved, so this is safe */
  });

  navigator.serviceWorker.register('./sw.js').then(function(reg){
    swReg = reg;
    /* iOS parks an installed-but-not-yet-active worker in "waiting", sometimes
       for days - long enough that a corrected prayer time would never arrive.
       Both the worker already waiting when we register and the one that appears
       while the app is open are covered. */
    nudge(reg.waiting);
    reg.addEventListener('updatefound', function(){
      var sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', function(){
        if (sw.state === 'installed') nudge(reg.waiting);
      });
    });
  })['catch'](function(){ /* no worker: the app still works, just without offline */ });
}

function checkForUpdate(){
  if (swReg && swReg.update) { try { swReg.update(); } catch (e){} }
}

/* --------------------------------------------------------------- the beat -- */
var timer = 0;

function tick(){
  /* The re-arm lives in finally for one reason: if render() ever throws, the
     old version simply stopped scheduling itself and the clock froze at that
     second for good - with nothing on screen to suggest that what he is
     reading is hours stale. Now a broken frame costs one frame. */
  try { render(Date.now()); }
  finally {
    /* Re-aimed at the next whole second every time instead of setInterval,
       which drifts and, after iOS unfreezes a backgrounded tab, fires a burst
       of catch-up callbacks. */
    clearTimeout(timer);
    timer = setTimeout(tick, 1000 - (Date.now() % 1000) + 8);
  }
}

function refreshAll(force){
  var t = Date.now();
  if (!force && t - lastTry < 60000) return;   /* app switching flaps visibility */
  lastTry = t;
  refreshTimes();
  checkForUpdate();
}

/* First paint is synchronous and offline, before any network call is made, so
   the app is never blank - not on a dead connection, not on a first launch in
   flight mode. */
var stored = loadCached(), seeded = loadSeed();
DATA = pickNewer(usable(stored) ? stored : null, usable(seeded) ? seeded : null);
tick();

setupSW();
refreshAll(true);

document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible') return;
  /* iOS throttles or freezes timers in the background: everything is recomputed
     from the clock here rather than trusting whatever the counters think. */
  tick();
  refreshAll(false);
});
window.addEventListener('pageshow', function(){ tick(); refreshAll(false); });
window.addEventListener('focus', function(){ tick(); });
window.addEventListener('online', function(){ refreshAll(true); });
setInterval(function(){ refreshAll(true); }, 900000);            /* 15 minutes */

})();
</script>
</body>
</html>
